[project]
name = "llm-release-action"
version = "0.0.0"  # Unused: releases are git tags.
description = "Analyze commits, suggest semantic version bumps, and generate multi-audience changelogs using LLM via LiteLLM."
requires-python = ">=3.11"
dependencies = [
    # LiteLLM for multi-provider LLM abstraction
    "litellm==1.103.1",
    # AWS SDK for Bedrock support. Pinned for reproducibility alongside litellm; bump both deliberately.
    "boto3==1.43.103",
    # YAML/JSON config parsing
    "pyyaml>=6.0.3",
    # Language code validation (lightweight lookup tables)
    "langcodes>=3.5.1",
    "language-data>=1.4.0",
    # Language detection for output validation (optional)
    "langdetect>=1.0.9",
    # Templating for prompts
    "jinja2>=3.1.6",
    # Regex with timeout support for ReDoS protection
    "regex>=2026.9.10",
    # Gitignore-style pattern matching for context files
    "pathspec>=1.1.1",
    # Unified diff parsing for diff analysis
    "unidiff>=1.0.1",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
lint = [
    "ruff>=0.17.0",
    "zizmor>=1.30.1",
]

[tool.uv]
# Scripts in src/ run directly; nothing to build or install.
package = false
default-groups = ["test", "lint"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The formatter handles line length; long strings are left as is.
ignore = ["E501"]
