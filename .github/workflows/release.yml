name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show suggested version without creating release)'
        required: false
        default: 'false'
        type: boolean

permissions: {}

jobs:
  # Runs the action, which installs packages and reads commit text anyone can
  # influence, so it only gets a read-only token.
  analyze:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Anthropic Workload Identity Federation: the action exchanges this job's
      # OIDC token (sub repo:lmgarret/llm-release-action:environment:release)
      # for a short-lived Anthropic token, so no API key is stored.
      id-token: write
    outputs:
      next_version: ${{ steps.llm.outputs.next_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Suggest version with LLM
        id: llm
        uses: ./
        with:
          model: anthropic/claude-sonnet-5-5
          context_files: CONTEXT.md
          context_max_tokens: 1000
          changelog_config: |
            developer:
              preset: developer
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}

      - name: Locate changelog
        id: changelog
        env:
          FILES: ${{ steps.llm.outputs.changelog_files }}
        run: |
          cp "$(jq -r '.developer.en' <<< "$FILES")" "$RUNNER_TEMP/release-notes.md"
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Show results
        env:
          CHANGELOG_FILE: ${{ steps.changelog.outputs.path }}
          CURRENT_VERSION: ${{ steps.llm.outputs.current_version }}
          NEXT_VERSION: ${{ steps.llm.outputs.next_version }}
          BUMP_TYPE: ${{ steps.llm.outputs.bump }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Release Summary

          **Current version:** $CURRENT_VERSION
          **Suggested version:** $NEXT_VERSION
          **Bump type:** $BUMP_TYPE

          ### Changelog

          EOF
          cat "$CHANGELOG_FILE" >> $GITHUB_STEP_SUMMARY

      - name: Upload changelog
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ steps.changelog.outputs.path }}
          retention-days: 1

  # Only creates the tag and release; runs no code from the repository.
  release:
    needs: analyze
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download changelog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.analyze.outputs.next_version }}
          SHA: ${{ github.sha }}
        run: |
          # Tag the commit that was analyzed, not whatever master is now
          gh release create "$VERSION" \
            --target "$SHA" \
            --title "Release $VERSION" \
            --notes-file release-notes.md

          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Created release: $VERSION" >> $GITHUB_STEP_SUMMARY

          # Update the floating major tag so consumers pinned to the major get
          # this release. Derived from the version rather than hardcoded, so a
          # v0.x release moves v0 and a v2.0.0 release moves v2 -- hardcoding v1
          # made every release claim to be v1.
          MAJOR="${VERSION%%.*}"

          # A prerelease must not become what the floating major tag points at.
          if [ "$VERSION" != "${VERSION%-*}" ]; then
            echo "Prerelease - $MAJOR tag left unchanged" >> $GITHUB_STEP_SUMMARY
          else
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$MAJOR" -f sha="$SHA" -F force=true \
              || gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$MAJOR" -f sha="$SHA"
            echo "Updated $MAJOR tag to point to $VERSION" >> $GITHUB_STEP_SUMMARY
          fi
