name: 'LLM Release Action'
description: 'Analyze commits, suggest semantic version bumps, and generate multi-audience changelogs using LLM via LiteLLM.'
author: 'Joe Nosov'

branding:
  icon: 'git-commit'
  color: 'purple'

inputs:
  model:
    description: 'LiteLLM model string (e.g., anthropic/claude-sonnet-5) for the analysis and the changelogs'
    required: true
  fast_model:
    description: 'Optional cheaper model for internal calls: project type detection, context summarization and diff extraction. Falls back to model if not set.'
    required: false
    default: ''
  project_type:
    description: 'Who consumes the project, which decides what counts as a breaking change: auto (detect from README and project files), library, api, service, app, or generic (type-agnostic rules).'
    required: false
    default: 'auto'
  head_ref:
    description: 'Head ref to compare to'
    required: false
    default: 'HEAD'
  base_ref:
    description: 'Git ref (tag, SHA or branch) to compare from. Default: the nearest tag matching tag_pattern before head_ref, or the whole history when there is none (first release).'
    required: false
    default: ''
  tag_pattern:
    description: 'Glob matching release tags, used to find the previous release when base_ref is not set (e.g. demo-*).'
    required: false
    default: 'v[0-9]*.[0-9]*.[0-9]*'
  current_version:
    description: 'Version to bump from. Default: the base tag, when it is a semver version. Without either, next_version is empty. Never changes the compared range.'
    required: false
    default: ''
  content_override:
    description: 'Markdown content to analyze instead of git history (multi-repo). Cannot be combined with base_ref, head_ref, tag_pattern or diffs. Format: ## Repo\n### Features\n- item. See https://lmgarret.github.io/llm-release-action/how-to/combine-repositories/'
    required: false
    default: ''
  changelog_config:
    description: 'YAML config for audiences. Format: {audience: {preset, languages, tone, ...}}. Presets: developer, customer, executive, marketing, security, ops. Default: one developer changelog. See https://lmgarret.github.io/llm-release-action/reference/changelog-config/'
    required: false
    default: ''
  context_files:
    description: 'Comma-separated file patterns for project context (gitignore-style, supports negation), e.g. "/README.md,docs/API.md" or "**/README.md,!**/node_modules/**". Default: the root README. Empty disables context.'
    required: false
    default: '/README.md'
  context_max_tokens:
    description: 'Maximum tokens for context content (increase for large-context models)'
    required: false
    default: '800'
  diffs:
    description: 'Comma-separated file patterns (gitignore-style, supports negation) whose diffs are analyzed for API, schema and other changes commit messages may not mention. Empty disables diff analysis.'
    required: false
    default: '**/openapi*.yaml,**/migrations/**,**/*.proto'
  diff_max_lines:
    description: 'Maximum total changed lines analyzed across all diffs. Higher-priority files (API specs, migrations, config) come first.'
    required: false
    default: '5000'
  llm_params:
    description: 'JSON object merged into every LLM call, e.g. ''{"temperature": 0.2}'', ''{"thinking": {"type": "adaptive"}}'' or ''{"reasoning_effort": "low"}''. Passed through as configured; the action does not check what a model accepts.'
    required: false
    default: ''
  max_tokens:
    description: 'Maximum tokens in each LLM response, including internal calls. On models that think, thinking tokens count against it.'
    required: false
    default: '4000'
  timeout:
    description: 'Request timeout in seconds'
    required: false
    default: '120'

outputs:
  bump:
    description: 'Bump type (major, minor, patch)'
    value: ${{ steps.analyze.outputs.bump }}
  current_version:
    description: 'The version compared from, or the base ref when there is no version'
    value: ${{ steps.analyze.outputs.current_version }}
  next_version:
    description: 'Calculated next semantic version (empty when there is no version to bump from)'
    value: ${{ steps.analyze.outputs.next_version }}
  release_name:
    description: 'Name of the release used in changelogs'
    value: ${{ steps.analyze.outputs.release_name }}
  changelogs:
    description: 'JSON object with changelogs: {audience: {language: markdown}}. Default: {default: {en: "..."}}. Schema: https://lmgarret.github.io/llm-release-action/reference/outputs/. Untrusted text: pass it to scripts via env, never interpolate it into run or script.'
    value: ${{ steps.analyze.outputs.changelogs }}
  changelog_files:
    description: 'JSON object with the path of a file holding each changelog: {audience: {language: path}}. Files are under RUNNER_TEMP, readable by later steps in the same job. Lets steps use a changelog (e.g. gh release create --notes-file) without handling its text in shell.'
    value: ${{ steps.analyze.outputs.changelog_files }}
  metadata:
    description: 'JSON object with release metadata per audience and language: {audience: {language: {title, summary, highlights}}}'
    value: ${{ steps.analyze.outputs.metadata }}
  changes:
    description: 'JSON array of structured changes from Phase 1 analysis'
    value: ${{ steps.analyze.outputs.changes }}
  stats:
    description: 'JSON object with change statistics: {features, fixes, breaking, contributors, ...}'
    value: ${{ steps.analyze.outputs.stats }}
  breaking_changes:
    description: 'JSON array of detected breaking changes'
    value: ${{ steps.analyze.outputs.breaking_changes }}
  reasoning:
    description: 'LLM reasoning for the version suggestion. Untrusted text: pass it to scripts via env, never interpolate it into run or script.'
    value: ${{ steps.analyze.outputs.reasoning }}
  project_type:
    description: 'Project type used for the analysis (library, api, service, app, or generic)'
    value: ${{ steps.analyze.outputs.project_type }}
  usage:
    description: 'JSON object with LLM usage per model: {model: {calls, input_tokens, output_tokens, latency_ms}}'
    value: ${{ steps.analyze.outputs.usage }}
  warnings:
    description: 'JSON array of warning messages (staleness, truncation, etc.)'
    value: ${{ steps.analyze.outputs.warnings }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    # uv is installed with pip so that the action only depends on GitHub-owned actions.
    # uv then checks every package against the hashes in uv.lock, and --frozen fails
    # instead of re-resolving if the lock is stale.
    - name: Install dependencies
      shell: bash
      env:
        UV_PROJECT: ${{ github.action_path }}
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/llm-release-action-venv
        UV_PYTHON: ${{ steps.python.outputs.python-path }}
      run: |
        pip install --quiet --require-hashes -r "$GITHUB_ACTION_PATH/.github/uv-requirements.txt"
        uv sync --frozen --no-default-groups

    - name: Run analysis
      id: analyze
      shell: bash
      env:
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_FAST_MODEL: ${{ inputs.fast_model }}
        INPUT_PROJECT_TYPE: ${{ inputs.project_type }}
        INPUT_HEAD_REF: ${{ inputs.head_ref }}
        INPUT_BASE_REF: ${{ inputs.base_ref }}
        INPUT_TAG_PATTERN: ${{ inputs.tag_pattern }}
        INPUT_CURRENT_VERSION: ${{ inputs.current_version }}
        INPUT_CONTENT_OVERRIDE: ${{ inputs.content_override }}
        INPUT_CHANGELOG_CONFIG: ${{ inputs.changelog_config }}
        INPUT_CONTEXT_FILES: ${{ inputs.context_files }}
        INPUT_CONTEXT_MAX_TOKENS: ${{ inputs.context_max_tokens }}
        INPUT_DIFFS: ${{ inputs.diffs }}
        INPUT_DIFF_MAX_LINES: ${{ inputs.diff_max_lines }}
        INPUT_LLM_PARAMS: ${{ inputs.llm_params }}
        INPUT_MAX_TOKENS: ${{ inputs.max_tokens }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        UV_PROJECT: ${{ github.action_path }}
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/llm-release-action-venv
        UV_PYTHON: ${{ steps.python.outputs.python-path }}
      run: uv run --no-sync python "$GITHUB_ACTION_PATH/src/analyze.py"
